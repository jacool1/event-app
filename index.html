<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Event Activities</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;600;800&display=swap">
<style>
:root{
  --bg:#F3F1F7;--surface:#FFFFFF;--ink:#1E1B33;--muted:#5E5A78;--line:#DDD9EA;
  --c-fragrance:#B8326F;--c-simulator:#1F5FD1;--c-wine-making:#7A1E3A;--c-painting:#B97A00;
  --on-accent:#FFFFFF;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#15131F;--surface:#201D30;--ink:#EEEAF8;--muted:#A9A4C4;--line:#34304A;
    --c-fragrance:#E0679F;--c-simulator:#5B93F5;--c-wine-making:#C75A7B;--c-painting:#E3A93A;--on-accent:#15131F}
}
:root[data-theme="dark"]{--bg:#15131F;--surface:#201D30;--ink:#EEEAF8;--muted:#A9A4C4;--line:#34304A;
  --c-fragrance:#E0679F;--c-simulator:#5B93F5;--c-wine-making:#C75A7B;--c-painting:#E3A93A;--on-accent:#15131F}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5;-webkit-text-size-adjust:100%}
main{max-width:560px;margin:0 auto;padding:0 20px 120px}
h1,h2,h3,p{margin:0}
.top{padding:28px 0 20px}
.top h1{font-size:2.4rem;line-height:1.05;font-weight:800;letter-spacing:-.02em}
.top p{margin-top:10px;color:var(--muted);max-width:34ch}
.list{display:grid;gap:12px;margin-top:8px}
.row{display:flex;align-items:center;gap:16px;padding:16px;border-radius:18px;background:var(--surface);border:1px solid var(--line);color:inherit;text-decoration:none;min-height:76px}
.row:focus-visible,.tab:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.swatch{flex:none;width:44px;height:44px;border-radius:12px;background:var(--a)}
.row h3{font-size:1.1rem;font-weight:600}
.row p{color:var(--muted);font-size:.92rem}
.hero{margin:20px 0;padding:28px 22px 24px;border-radius:24px;background:var(--a);color:var(--on-accent);min-height:190px;display:flex;flex-direction:column;justify-content:flex-end}
.hero h1{font-size:2.6rem;line-height:1;font-weight:800;letter-spacing:-.02em}
.hero p{margin-top:8px;opacity:.92}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:22px}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.fact span{display:block;font-size:.8rem;color:var(--muted)}
.fact b{font-weight:600}
section h2{font-size:1.2rem;font-weight:600;margin:22px 0 8px}
section p{color:var(--muted);max-width:60ch}
ul.expect{padding:0;margin:0;list-style:none;display:grid;gap:8px}
ul.expect li{padding:12px 14px;background:var(--surface);border-left:4px solid var(--a);border-radius:6px 12px 12px 6px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav .bar{display:flex;max-width:560px;margin:0 auto}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px;border-radius:12px;text-decoration:none;color:var(--muted);font-size:.72rem;font-weight:600;min-height:52px}
.tab i{width:22px;height:6px;border-radius:3px;background:var(--line)}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"] i{background:var(--a,var(--ink))}
</style>
</head>
<body>
<main id="app" tabindex="-1"></main>
<nav aria-label="Activities"><div class="bar" id="tabs"></div></nav>
<script>
var A=[
 {id:"fragrance",name:"Fragrance",tag:"Blend a scent of your own",time:"Placeholder time",place:"Placeholder room",
  about:"This is placeholder text. Describe the fragrance activity here: what guests will make, who leads it, and what they take home.",
  expect:["Smell and compare sample notes","Mix a small bottle to keep","Learn how scents are layered"]},
 {id:"simulator",name:"Simulator",tag:"Try the ride for yourself",time:"Placeholder time",place:"Placeholder room",
  about:"This is placeholder text. Describe the simulator here: what it is, how long each turn lasts, and any height or safety notes.",
  expect:["Short turns, so lines move quickly","Staff help with setup","Watch friends from the sidelines"]},
 {id:"wine-making",name:"Wine Making",tag:"Crush, press and bottle",time:"Placeholder time",place:"Placeholder room",
  about:"This is placeholder text. Describe the wine making activity here: the steps guests take and what they leave with.",
  expect:["Hands-on grape pressing","Taste three young wines","Design a label for your bottle"]},
 {id:"painting",name:"Painting",tag:"Pick up a brush and join in",time:"Placeholder time",place:"Placeholder room",
  about:"This is placeholder text. Describe the painting session here: the subject, the supplies provided, and the skill level needed.",
  expect:["All supplies provided","Guided, step-by-step canvas","Take your painting home"]}
];
var app=document.getElementById("app"),tabs=document.getElementById("tabs");
function find(id){for(var i=0;i<A.length;i++)if(A[i].id===id)return A[i]}
function cv(id){return "var(--c-"+id+")"}
function home(){
  var h='<div class="top"><h1>Event Name</h1><p>Four side activities to explore. Pick one to see details.</p></div><div class="list">';
  A.forEach(function(a){h+='<a class="row" href="#'+a.id+'" style="--a:'+cv(a.id)+'"><span class="swatch"></span><div><h3>'+a.name+'</h3><p>'+a.tag+'</p></div></a>'});
  return h+'</div>';
}
function page(a){
  var l='';a.expect.forEach(function(e){l+='<li>'+e+'</li>'});
  return '<div style="--a:'+cv(a.id)+'"><div class="hero"><h1>'+a.name+'</h1><p>'+a.tag+'</p></div>'+
  '<div class="facts"><div class="fact"><span>When</span><b>'+a.time+'</b></div><div class="fact"><span>Where</span><b>'+a.place+'</b></div></div>'+
  '<section><h2>About this activity</h2><p>'+a.about+'</p><h2>What to expect</h2><ul class="expect">'+l+'</ul></section></div>';
}
function render(){
  var id=(location.hash||"").replace("#",""),a=find(id);
  app.innerHTML=a?page(a):home();
  var t='<a class="tab" href="#" '+(a?'':'aria-current="page"')+'><i></i>Home</a>';
  A.forEach(function(x){t+='<a class="tab" href="#'+x.id+'" style="--a:'+cv(x.id)+'" '+(a&&a.id===x.id?'aria-current="page"':'')+'><i></i>'+x.name+'</a>'});
  tabs.innerHTML=t;
  window.scrollTo(0,0);
}
window.addEventListener("hashchange",render);
render();
</script>
</body>
</html>
